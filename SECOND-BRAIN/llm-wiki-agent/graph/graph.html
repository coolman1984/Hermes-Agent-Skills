ing market tools if they become central enough to deserve their own nodes.\n\n\n## الدفعة الثانية: الحالات القطاعية والتقييم العملي\nتمت إضافة مصفوفة تقييم القطاعات وحالة مقارنة خريطة أبريل بالدستور. هذه الدفعة تنقل الويكي من حفظ القواعد العامة إلى اختبارها على حالات قطاعية، وتضيف مفهومين مهمين: [[SectorEvaluationMatrix]] و[[SectorCaseReview]].\n\nالأثر العملي: أي نقاش قطاعي قادم يجب أن يمر عبر سؤالين قبل اختيار الأسهم: هل القطاع جذاب وفق المصفوفة؟ وهل توجد حالة أو محفز يبرر المتابعة الآن؟\n",

    "markdown": "---\ntitle: \"LLM Wiki Pattern\"\ntype: concept\ntags: [knowledge-base, markdown, workflow]\nsources: [karpathy-llm-wiki, llm-wiki-agent]\nlast_updated: \"2026-04-17\"\n---\n\n# LLM Wiki Pattern\n\nThe LLM Wiki Pattern is a persistent, compounding knowledge base built from markdown files. Raw sources are read once, compiled into a structured wiki, and then maintained over time rather than re-derived on every question.\n\n## Core layers\n\n- Raw sources: immutable capture of articles, papers, notes, and transcripts.\n- Wiki: agent-maintained markdown pages for sources, entities, concepts, and syntheses.\n- Schema: instructions and conventions that keep the wiki coherent.\n\n## Core behaviors\n\n- Ingest new sources into the wiki.\n- Update the overview and index as knowledge grows.\n- Create or update entity and concept pages when they become important.\n- Flag contradictions instead of silently overwriting them.\n- File valuable answers back into the wiki so they compound.\n- Run linting and graph generation to keep the structure healthy.\n\n## Why it works\n\nThe tedious part of knowledge management is bookkeeping, not thinking. The pattern delegates the bookkeeping to the LLM so the human can focus on choosing sources, asking better questions, and deciding what matters.\n\n## Related pages\n\n- [[AndrejKarpathy]]\n- [[SamurAIGPT]]\n- [[llm-wiki-agent]]",

    "markdown": "---\ntitle: \"Karpathy LLM Wiki\"\ntype: source\ntags: [karpathy, llm-wiki, knowledge-base]\ndate: 2026-04-02\nsource_file: raw/karpathy-llm-wiki.md\nlast_updated: 2026-04-17\n---\n\n# Karpathy LLM Wiki\n\n## Summary\n\nAndrej Karpathy's idea file describes a persistent wiki that is compiled from raw source documents and maintained by an LLM over time. Instead of using the model only for one-shot retrieval, the wiki keeps accumulating summaries, backlinks, concept pages, entity pages, and a living synthesis.\n\n## Key Claims\n\n- Raw sources should be immutable and separate from the wiki.\n- The LLM should maintain the wiki, not just answer queries from it.\n- Knowledge should be compiled once and kept current.\n- Query outputs can be filed back into the wiki so they compound.\n- Linting and graphing are part of the workflow, not optional extras.\n\n## Key Quotes\n\n> \"the wiki is a persistent, compounding artifact\"\n\n> \"the LLM does all the grunt work\"\n\n## Connections\n\n- [[AndrejKarpathy]] — originator of the pattern\n- [[LLMWikiPattern]] — the concept described by the source\n- [[llm-wiki-agent]] — practical implementation inspired by the idea\n\n## Contradictions\n\n- None found in the current seed set.",

    "markdown": "---\ntitle: \"LLM Wiki Agent\"\ntype: source\ntags: [github, implementation, workflow]\ndate: 2026-04-17\nsource_file: raw/llm-wiki-agent.md\nlast_updated: 2026-04-17\n---\n\n# LLM Wiki Agent\n\n## Summary\n\n`llm-wiki-agent` is the strongest working GitHub implementation found for the LLM Wiki pattern. It provides a clear repository layout, explicit workflows, and Python tools for ingesting sources, querying the wiki, linting for health issues, and building a graph visualization.\n\n## Key Claims\n\n- The repo is organized around `raw/`, `wiki/`, `graph/`, and `tools/`.\n- Ingest creates source pages and updates index, overview, entities, concepts, and log entries.\n- Query selects relevant pages from the index, synthesizes an answer, and can save it back as a synthesis page.\n- Lint catches orphans, broken links, missing entities, contradictions, and data gaps.\n- Graph generation turns wikilinks into explicit edges and can infer relationships for visualization.\n\n## Key Quotes\n\n> \"Drop source documents into `raw/` and tell the agent to ingest them\"\n\n> \"Every new source makes the wiki richer\"\n\n## Connections\n\n- [[SamurAIGPT]] — maintainer of the repository\n- [[LLMWikiPattern]] — the pattern implemented here\n- [[AndrejKarpathy]] — inspiration for the repo\n\n## Contradictions\n\n- None found in the current seed set.",

    "markdown": "---\ntitle: \"مشروع الاستثمار في البورصة المصرية\"\ntype: source\ntags: [egypt, egx, portfolio, project]\ndate: \"2026-04-17\"\nsource_file: raw/egyptian-stock-investment-project.md\nlast_updated: \"2026-04-17\"\n---\n\n# مشروع الاستثمار في البورصة المصرية\n\n## Summary\n\nهذه الورقة ترسم المشروع الاستثماري العام في البورصة المصرية كمنظومة تبدأ من القطاع والنظام الكلي ثم تنتقل إلى الشركة ثم التوقيت. تؤكد أن النشاط المقبول شرعياً والسيولة وجودة التدفقات والوزن النسبي للقطاعات أهم من القصة أو الاسم اللامع، وتتعامل مع النقد كخيار مشروع عند غياب البدائل النظيفة.\n\n## Key Claims\n\n- ابدأ من القطاع والنظام الاقتصادي ثم الشركة ثم التوقيت.\n- في بيئة فائدة مرتفعة وضغط طاقة، الأولوية للقطاعات الدفاعية والمصدّرة أو ذات الإيراد الدولاري.\n- السيولة يجب أن تكون فلترًا قبل القطاع، لا بعده.\n- القبول الشرعي فوق المثال؛ البنوك التقليدية الربوية والتبغ والأنشطة المشبوهة لا تدخل السلة المفضلة.\n- النقد يبقى خيارًا مشروعًا إذا لم تكتمل القطاعات النظيفة.\n- ما زال مطلوبًا تثبيت الكون الاستثماري والسيولة الدنيا وسقف الأوزان والخروج والمراجعة.\n\n## Key Quotes\n\n> \"نبدأ من القطاع والنظام الاقتصادي، ثم نختار الشركة، ثم نحدد التوقيت.\"\n> \"السيولة يجب أن تكون فلترًا قبل القطاع، لا بعده.\"\n\n## Connections\n\n- [[EGXInvestmentDoctrine]] — يمثل الطبقة العليا لهذا المشروع\n- [[IntegratedSectorSelection]] — يحوّل المخاطر إلى وظائف قطاعات\n- [[SourceLadder]] — يرتب الحقيقة الرسمية قبل التفسير والتوقيت\n- [[EGX]] — المصدر الرسمي لحقائق الشركة والسوق\n- [[CBE]] — مرجع الفائدة والسيولة والاتجاه النقدي\n- [[CAPMAS]] — مرجع التضخم والضغط على الطلب\n- [[FRA]] — مرجع التنظيم والقواعد\n\n## Contradictions\n\n- None yet.\n",

    "markdown": "---\ntitle: \"دستور قرار الاستثمار في البورصة المصرية\"\ntype: source\ntags: [egypt, egx, doctrine, decision]\ndate: \"2026-04-17\"\nsource_file: raw/investment-decision-constitution-egypt.md\nlast_updated: \"2026-04-17\"\n---\n\n# دستور قرار الاستثمار في البورصة المصرية\n\n## Summary\n\nهذا الدستور يربط القرار الاستثماري بالمخاطر ووظائف القطاعات لا بأسماء الأسهم. يفرض فلتر قبول شرعي، ويطلب بطاقة قطاع واضحة، ويحدد ست خطوات لاتخاذ القرار مع سقف 35 إلى 40 في المئة على السيناريو الواحد.\n\n## Key Claims\n\n- ابدأ من المخاطر، لا من الأسهم.\n- القطاع يجب أن يضيف وظيفة جديدة أو حماية جديدة للمحفظة.\n- فلتر القبول الشرعي يستبعد الربا الفاضح والتبغ والأنشطة غير المتوافقة جوهريًا.\n- لا تكرر نفس المحرك أو تبنِ أكثر من قطاعين على نفس المحرك الرئيسي.\n- وجود قطاع دفاعي وقطاع خارجي وقطاع قليل الحساسية للطاقة مهم في مصر.\n- لكل قطاع بطاقة قرار قبل الاعتماد النهائي، وسقف 35 إلى 40 في المئة يحمي من رهينة سيناريو واحد.\n\n## Key Quotes\n\n> \"ابدأ من المخاطر، لا من الأسهم.\"\n> \"التنويع الحقيقي = اختلاف سبب الربح والخسارة.\"\n\n## Connections\n\n- [[EGXInvestmentDoctrine]] — هو الصياغة التنفيذية للدستور الأعلى\n- [[IntegratedSectorSelection]] — يشرح كيف تتحول المخاطر إلى قطاعات\n- [[SourceLadder]] — يعتمد ترتيب المصادر الرسمي أولًا\n- [[EGX]] — مصدر الحقائق الخاصة بالشركة والسوق\n- [[CBE]] — يملي بيئة الفائدة والسيولة\n- [[CAPMAS]] — يشرح ضغط التضخم والطلب\n- [[FRA]] — يحكم التنظيم والامتثال\n\n## Contradictions\n\n- None yet.\n",

    "markdown": "---\ntitle: \"منهج اختيار القطاعات المتكاملة\"\ntype: source\ntags: [egypt, egx, sector-selection, doctrine]\ndate: \"2026-04-17\"\nsource_file: raw/integrated-sector-selection-method.md\nlast_updated: \"2026-04-17\"\n---\n\n# منهج اختيار القطاعات المتكاملة\n\n## Summary\n\nهذا المنهج هو الجسر بين الدستور العام والتنفيذ العملي. يحول المخاطر الكلية إلى وظائف قطاعات، ويثبت فلاتر الشرع والسيولة والحوكمة وعدم تكرار المحرك، ثم يترجم ذلك إلى أسهم قابلة للاختيار مع بقاء النقد خيارًا مشروعًا إذا لم توجد قطاعات نظيفة كافية.\n\n## Key Claims\n\n- فلتر القبول الشرعي والفلتر السيولي يسبقان القصة.\n- كل خطر كلي يجب أن يُقابل بوظيفة قطاع مضادة أو مكملة.\n- لا يدخل أي قطاع يكرر نفس المحرك تحت اسم آخر.\n- في التنفيذ العملي نختار خمسة قطاعات فقط ذات وظائف مختلفة قدر الإمكان.\n- القطاع يعين أين نبحث، والسهم يقرر هل نشتري أم لا.\n- إذا لم نتمكن من ملء بطاقة القطاع بوضوح، فلا ندخله.\n\n## Key Quotes\n\n> \"هذا هو الجسر بين الدستور العام وبين التنفيذ العملي داخل السوق المصري.\"\n> \"إذا لم نستطع ملء هذا القالب بوضوح، لا ندخله.\"\n\n## Connections\n\n- [[EGXInvestmentDoctrine]] — يترجم الدستور إلى منهج قطاعات\n- [[IntegratedSectorSelection]] — الصفحة المفاهيمية العليا لهذا المنهج\n- [[EGXPortfolioMonitoringSystem]] — ينعكس على شكل المحفظة وتشغيلها\n\n## Contradictions\n\n- None yet.\n",

    "markdown": "---\ntitle: \"EGX Portfolio Monitoring System\"\ntype: source\ntags: [egypt, egx, portfolio, workflow, system]\ndate: \"2026-04-17\"\nsource_file: raw/egx-portfolio-monitoring-system.md\nlast_updated: \"2026-04-17\"\n---\n\n# EGX Portfolio Monitoring System\n\n## Summary\n\nهذا هو دليل التشغيل للمحفظة المصرية المركزة لكن المنضبطة. يعرّف فلتر النشاط المقبول شرعياً، وشكل المحفظة المستهدف، وطبقات المصادر المعتمدة، وقاعدة Camoufox للروابط الصعبة، ودورة المتابعة اليومية والأسبوعية والشهرية، والمخرجات القياسية لكل سهم.\n\n## Key Claims\n\n- ركز أكثر وشتت أقل، ولا تحتفظ بمراكز ديكورية.\n- المحفظة المستهدفة تجمع نواة قليلة مع طبقة تكتيكية محدودة ونقد مسموح عند غياب الفرص.\n- الفائدة والسيولة والتشغيل والدفاع والتصدير والعقار الانتقائي تمثل أدوارًا مختلفة داخل المحفظة.\n- الحقيقة الرسمية أولًا: EGX وIR الشركة وCBE وCAPMAS وFRA والمنظم القطاعي.\n- Camoufox-first للروابط الصعبة مثل X وSubstack، مع أولوية للنص لا للصور.\n- اليومي والأسبوعي والشهري يحددان ماذا نحتفظ وماذا نقلل وماذا نخرج.\n\n## Key Quotes\n\n> \"لا نبدأ من السعر، بل من الدور والجودة والمرحلة\"\n> \"الرسمي يغلب غيره دائمًا\"\n\n## Connections\n\n- [[EGXPortfolioMonitoringSystem]] — الصفحة المفاهيمية التي تجمع هذا التشغيل\n- [[EGXInvestmentDoctrine]] — يتغذى من الدستور الاستثماري الأعلى\n- [[SourceLadder]] — يرتب طبقات المصادر الرسمية والتفسيرية\n- [[IntegratedSectorSelection]] — ينعكس على اختيار القطاعات والأوزان\n- [[EGX]] — الحقيقة الرسمية للشركة والسوق\n- [[CBE]] — مرجع السياسة النقدية\n- [[CAPMAS]] — مرجع التضخم والبيانات الرسمية\n- [[FRA]] — مرجع القواعد والتنظيم\n\n## Contradictions\n\n- None yet.\n",

    "markdown": "---\ntitle: \"مصفوفة تقييم القطاعات\"\ntype: source\ntags: [egx, sectors, evaluation]\ndate: 2026-05-15\nsource_file: raw/sector-evaluation-matrix-egypt.md\n---\n\n## Summary\nهذه الصفحة تلخص مصدرًا تشغيليًا يحدد طريقة تقييم القطاعات المصرية قبل الانتقال إلى اختيار الأسهم. القيمة الأساسية في تحويل القطاع من انطباع عام إلى مقارنة منظمة بين الجاذبية، المخاطر، المحفزات، جودة البيانات، وقابلية المتابعة.\n\n## Key Claims\n- تقييم القطاع يسبق تقييم السهم، لأن قوة القطاع تقلل ضوضاء القرار الفردي.\n- المصفوفة تمنع الانحياز للقصص الجذابة بدون دلائل تشغيلية ومصادر موثوقة.\n- القطاع الجيد ليس فقط الأسرع نموًا، بل الأكثر وضوحًا في المحفزات والمخاطر وسهولة المتابعة.\n\n## Connections\n- [[EGX]] — السوق محل التطبيق.\n- [[IntegratedSectorSelection]] — الإطار الأعلى لاختيار القطاعات.\n- [[SectorEvaluationMatrix]] — المفهوم المستخرج من المصدر.\n- [[SourceLadder]] — يحدد جودة المصادر التي تغذي المصفوفة.\n\n## Contradictions\n- لا يوجد تعارض مسجل. المصدر يضيف طبقة تقييم عملية فوق دستور اختيار القطاعات.\n",

    "markdown": "---\ntitle: \"تحليل خريطة أبريل مقابل الدستور\"\ntype: source\ntags: [egx, sector-case, validation]\ndate: 2026-05-15\nsource_file: raw/april-sector-map-vs-constitution.md\n---\n\n## Summary\nهذه الصفحة تلخص حالة اختبارية تقارن خريطة قطاعات فعلية في أبريل بدستور اختيار القطاعات. فائدتها أنها تحول الدستور من قواعد نظرية إلى مراجعة حالة عملية يمكن استخدامها لتعديل الأوزان والأسئلة.\n\n## Key Claims\n- الحالات الزمنية تكشف ما إذا كان الدستور العملي قابلًا للاستخدام تحت ضغط معلومات حقيقية.\n- مقارنة الخريطة بالدستور تساعد على كشف التسرع، نقص البيانات، أو تجاهل محفزات ومخاطر قطاعية.\n- الحالة القطاعية يجب أن تنتهي بسؤال قرار: متابعة، بحث أعمق، أو استبعاد مؤقت.\n\n## Connections\n- [[EGX]] — السوق محل التطبيق.\n- [[IntegratedSectorSelection]] — الدستور الذي تتم المقارنة به.\n- [[SectorCaseReview]] — المفهوم المستخرج من الحالة.\n- [[EGXInvestmentDoctrine]] — قواعد القرار الأعلى.\n\n## Contradictions\n- لا يوجد تعارض مسجل. المصدر يعمل كاختبار جودة للدستور لا كبديل عنه.\n",

    "markdown": "---\ntitle: \"قرار دورة الذكاء الأسبوعية - 2026-05-15\"\ntype: synthesis\ntags: [weekly-intelligence-cycle, opportunities, execution]\nsources: [copywriting-review-service, hermes-agent-personal-agent-operating-system]\nlast_updated: 2026-05-15\n---\n\n# قرار دورة الذكاء الأسبوعية - 2026-05-15\n\n## السؤال\nما الفرصة التي تستحق الحركة الآن من مواد الأسبوع، وما الذي يجب تقويته داخليًا، وما الذي يجب إيقافه مؤقتًا؟\n\n## الإجابة\nالفرصة الأقرب للحركة هي تجربة خدمة مراجعة نص بيع خلال أربع وعشرين ساعة. التحسين الداخلي الأهم هو تقوية نظام الوكلاء الشخصية وطبقة المعرفة حتى لا يعاد اكتشاف السياق كل مرة. الشيء الذي يركن الآن هو صفحات الويب التفاعلية للمراجعة لأنها تضيف واجهة قبل ثبات نظام القرار.\n\n## الروابط\n- [[EGXPortfolioMonitoringSystem]] — مثال على نظام داخلي يحتاج ذاكرة وتشغيلًا ثابتًا.\n- [[LLMWikiPattern]] — نمط حفظ المعرفة المركبة.\n- [[EGXInvestmentDoctrine]] — مثال على قرار منضبط بقواعد.\n\n## القرار العملي\nلا نفتح مشروعًا جديدًا هذا الأسبوع. ننتج ثلاث عينات مراجعة نصوص بيعية، ثم نقرر إن كان المسار يستحق عرضًا مدفوعًا.\n",

function hexToRgba(color, alpha) {
  if (!color) return `rgba(255, 255, 255, ${alpha})`;
  const normalized = color.replace("#", "");
  const value = normalized.length === 3
    ? normalized.split("").map(ch => ch + ch).join("")
    : normalized;
  const intValue = Number.parseInt(value, 16);
  const r = (intValue >> 16) & 255;
  const g = (intValue >> 8) & 255;
  const b = intValue & 255;
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function escapeHtml(text) {
  return (text || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function stripFrontmatter(markdown) {
  return (markdown || "").replace(/^---\n[\s\S]*?\n---\n?/, "");
}

function renderInlineMarkdown(text) {
  let html = escapeHtml(text);
  html = html.replace(/\[\[([^\]]+)\]\]/g, '<span class="wikilink">[[$1]]</span>');
  html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
  html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  return html;
}

  }

      html.push("<pre><code></code></pre>");
      return;

    html.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);

      listItems.push(unorderedMatch[1]);
      continue;
    }

    const orderedMatch = trimmed.match(/^\d+\.\s+(.+)$/);
    if (orderedMatch) {
      flushParagraph();
      if (listType && listType !== "ol") flushList();
      listType = "ol";
      listItems.push(orderedMatch[1]);
      continue;
    }

    flushList();
    paragraph.push(trimmed);
  }

  if (inCodeBlock) flushCode();
  flushParagraph();
  flushList();
  flushQuote();
  return html.join("");
}

function rebuildAdjacency(filteredEdges) {
  adjacency.clear();
  for (const node of originalNodes) {
    adjacency.set(node.id, new Set());
  }
  for (const edge of filteredEdges) {
    if (!adjacency.has(edge.from)) adjacency.set(edge.from, new Set());
    if (!adjacency.has(edge.to)) adjacency.set(edge.to, new Set());
    adjacency.get(edge.from).add(edge.to);
    adjacency.get(edge.to).add(edge.from);
  }
}

function currentEdgeState() {
  const minConf = parseInt(controls.confSlider.value, 10) / 100;
  controls.confValue.textContent = minConf.toFixed(2);
  return {
    showExtracted: controls.extracted.checked,
    showInferred: controls.inferred.checked,
    showAmbiguous: controls.ambiguous.checked,
    minConf,
  };
}

function passesEdgeFilters(edge, edgeState) {
  const typeOk = (edge.type === "EXTRACTED" && edgeState.showExtracted)
    || (edge.type === "INFERRED" && edgeState.showInferred)
    || (edge.type === "AMBIGUOUS" && edgeState.showAmbiguous);
  const confOk = (edge.confidence ?? 1.0) >= edgeState.minConf;
  return typeOk && confOk;
}

function searchNodes(q) {
  applyFilters(q, activeNodeId);
}

function clearSelection() {
  activeNodeId = null;
  closeDrawer();
  applyFilters(searchInput.value, null);
}

function closeDrawer() {
  document.getElementById("drawer").classList.remove("open");
}

function openDrawer(node, relatedIds) {
  document.getElementById("drawer").classList.add("open");
  document.getElementById("drawer-title").textContent = node.label;
  const communityText = Number.isInteger(node.group) && node.group >= 0 ? ` · community ${node.group}` : "";
  document.getElementById("drawer-meta").textContent = `${node.type}${communityText}`;
  document.getElementById("drawer-path").textContent = node.path;
  document.getElementById("drawer-preview").textContent = node.preview || "";
  document.getElementById("drawer-markdown").innerHTML = renderMarkdown(node.markdown || "");

  const relatedList = document.getElementById("drawer-related-list");
  relatedList.innerHTML = "";
  const relatedNodes = originalNodes
    .filter(item => relatedIds.has(item.id) && item.id !== node.id)
    .sort((a, b) => a.label.localeCompare(b.label));

  if (relatedNodes.length === 0) {
    const empty = document.createElement("span");
    empty.textContent = "No directly connected nodes";
    relatedList.appendChild(empty);
    return;
  }

  for (const related of relatedNodes) {
    const chip = document.createElement("button");
    chip.className = "related-chip";
    chip.textContent = related.label;
    chip.onclick = () => focusNode(related.id);
    relatedList.appendChild(chip);
  }
}

function applyFilters(query = searchInput.value, selectedNodeId = activeNodeId) {
  const lower = (query || "").trim().toLowerCase();
  const edgeState = currentEdgeState();
  const filteredEdges = originalEdges.filter(edge => passesEdgeFilters(edge, edgeState));
  rebuildAdjacency(filteredEdges);

  const relatedIds = selectedNodeId
    ? new Set([selectedNodeId, ...(adjacency.get(selectedNodeId) || [])])
    : null;
  const filteredNodeIds = new Set();
  for (const edge of filteredEdges) {
    filteredNodeIds.add(edge.from);
    filteredNodeIds.add(edge.to);
  }

  let visibleNodeCount = 0;
  const nodeUpdates = originalNodes.map(node => {
    const matchesSearch = !lower || node.label.toLowerCase().includes(lower);
    const isActive = selectedNodeId === node.id;
    const isConnected = filteredNodeIds.has(node.id);
    const isRelated = !relatedIds || relatedIds.has(node.id);
    const hidden = !selectedNodeId && !lower && !isConnected;
    const emphasized = matchesSearch && isRelated && (isConnected || !!lower || isActive);

    if (!hidden) {
      visibleNodeCount += 1;
    }

    return {
      id: node.id,
      hidden,
      color: {
        background: emphasized ? node.color : hexToRgba(node.color, hidden ? 0.05 : 0.14),
        border: emphasized ? hexToRgba(node.color, 0.96) : hexToRgba(node.color, hidden ? 0.08 : 0.22),
        highlight: { background: node.color, border: hexToRgba(node.color, 1) },
        hover: { background: node.color, border: hexToRgba(node.color, 1) },
      },
      font: {
        color: emphasized ? "#f2f3f8" : hidden ? "rgba(242,243,248,0.08)" : "rgba(242,243,248,0.2)",
      },
      borderWidth: isActive ? 5 : 2,
      size: isActive ? 18 : 12,
    };
  });

  const edgeUpdates = originalEdges.map(edge => {
    const enabled = passesEdgeFilters(edge, edgeState);
    if (!enabled) {
      return { id: edge.id, hidden: true };
    }

    const matchesSearch = !lower
      || nodeMap.get(edge.from)?.label.toLowerCase().includes(lower)
      || nodeMap.get(edge.to)?.label.toLowerCase().includes(lower);
    const isRelated = !relatedIds || relatedIds.has(edge.from) || relatedIds.has(edge.to);
    const touchesActive = !!selectedNodeId && (edge.from === selectedNodeId || edge.to === selectedNodeId);
    const emphasized = matchesSearch && isRelated;

    return {
      id: edge.id,
      hidden: false,
      width: touchesActive ? 2.8 : emphasized ? 1.2 : 0.6,
      color: emphasized ? edge.color : hexToRgba(edge.color, 0.08),
    };
  });

  nodes.update(nodeUpdates);
  edges.update(edgeUpdates);

  if (selectedNodeId) {
    const activeNode = nodeMap.get(selectedNodeId);
    if (activeNode) {
      openDrawer(activeNode, relatedIds || new Set([selectedNodeId]));
    }
  }

  const focusSuffix = selectedNodeId && nodeMap.get(selectedNodeId)
    ? ` · focused: ${nodeMap.get(selectedNodeId).label}`
    : "";
  stats.textContent = `${visibleNodeCount} nodes · ${filteredEdges.length} edges${focusSuffix}`;
}

const container = document.getElementById("graph");

// Adaptive physics based on graph size
const nodeCount = originalNodes.length;
const gravConst = nodeCount > 80 ? -8000 : nodeCount > 30 ? -5000 : -2000;
const springLen = nodeCount > 80 ? 250 : nodeCount > 30 ? 200 : 150;

const network = new vis.Network(container, { nodes, edges }, {
  nodes: {
    shape: "dot",
    font: { color: "#ddd", size: 12, strokeWidth: 3, strokeColor: "#111" },
    borderWidth: 1.5,
    scaling: {
      min: 8,
      max: 40,
      label: { enabled: true, min: 10, max: 20, drawThreshold: 6, maxVisible: 24 },
    },
  },
  edges: {
    width: 0.8,
    smooth: { type: "continuous" },
    arrows: { to: { enabled: true, scaleFactor: 0.4 } },
    color: { inherit: false },
    hoverWidth: 2,
  },
  physics: {
    stabilization: { iterations: 250, updateInterval: 25, fit: true },
    barnesHut: { gravitationalConstant: gravConst, springLength: springLen, springConstant: 0.02, damping: 0.15 },
    minVelocity: 0.75,
  },
  interaction: { hover: true, tooltipDelay: 150, hideEdgesOnDrag: true, hideEdgesOnZoom: true },
});

// Ensure the graph fits the viewport after physics stabilization
network.once("stabilizationIterationsDone", function () {
  network.fit({ animation: { duration: 400, easingFunction: "easeInOutQuad" } });
});

function focusNode(nodeId) {
  activeNodeId = nodeId;
  applyFilters(searchInput.value, nodeId);
  const node = nodeMap.get(nodeId) || nodes.get(nodeId);
  const relatedIds = new Set([nodeId, ...(adjacency.get(nodeId) || [])]);
  openDrawer(node, relatedIds);
  network.focus(nodeId, {
    scale: 1.1,
    animation: { duration: 300, easingFunction: "easeInOutQuad" },
  });
}

network.on("click", params => {
  if (params.nodes.length > 0) {
    focusNode(params.nodes[0]);
  } else {
    clearSelection();
  }
});

applyFilters();
</script>
</body>
