<script>
(function(){
  "use strict";
  var raw = document.getElementById('catalog-data').textContent.trim();
  var DATA;
  try { DATA = JSON.parse(raw); }
  catch (e) {
    document.getElementById('main').innerHTML =
      '<div class="no-results">Catalog data not injected yet. Run <span class="mono">python3 scripts/build_catalog.py</span> to populate this page.</div>';
    return;
  }

  var TAB_COLORS = ["--tab-a","--tab-b","--tab-c","--tab-d","--tab-e"];
  var domainColor = {};
  DATA.domains.forEach(function(d,i){ domainColor[d.id] = "var(" + TAB_COLORS[i % TAB_COLORS.length] + ")"; });

  document.getElementById('genDate').textContent = (DATA.generated_at || '').slice(0,10) || '—';
  document.getElementById('totalCount').textContent = DATA.skill_count;
  document.getElementById('domainCount').textContent = DATA.domains.length;

  var activeDomain = null, query = "";
  var domainListEl = document.getElementById('domainList');
  var mainEl = document.getElementById('main');
  var overlay = document.getElementById('overlay');

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function orderedDomains(){ return DATA.domains.slice().sort(function(a,b){ return a.order-b.order; }); }

  function renderRail(){
    domainListEl.innerHTML = '';
    var all = document.createElement('li');
    all.className = 'domain-item';
    all.innerHTML = '<button class="' + (activeDomain===null?'active':'') + '" data-id="" style="--dc:var(--accent)">' +
      '<span class="swatch"></span><span>All skills</span><span class="n">' + DATA.skill_count + '</span></button>';
    domainListEl.appendChild(all);
    orderedDomains().forEach(function(d){
      var li = document.createElement('li');
      li.className = 'domain-item';
      li.innerHTML = '<button class="' + (activeDomain===d.id?'active':'') + '" data-id="' + d.id + '" style="--dc:' + domainColor[d.id] + '">' +
        '<span class="swatch"></span><span>' + esc(d.title) + '</span><span class="n">' + d.count + '</span></button>';
      domainListEl.appendChild(li);
    });
    domainListEl.querySelectorAll('button').forEach(function(btn){
      btn.addEventListener('click', function(){
        activeDomain = btn.dataset.id || null;
        renderRail(); renderMain();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
  }

  function matches(s){
    if (activeDomain && s.domain !== activeDomain) return false;
    if (!query) return true;
    var q = query.toLowerCase();
    return s.name.toLowerCase().indexOf(q) !== -1
      || (s.description||'').toLowerCase().indexOf(q) !== -1
      || (s.tags||[]).some(function(t){ return t.toLowerCase().indexOf(q) !== -1; })
      || (s.original_category||'').toLowerCase().indexOf(q) !== -1;
  }

  function renderMain(){
    var domains = activeDomain ? DATA.domains.filter(function(d){ return d.id===activeDomain; }) : orderedDomains();
    mainEl.innerHTML = '';
    var any = false;
    domains.forEach(function(d){
      var items = DATA.skills.filter(function(s){ return s.domain===d.id && matches(s); });
      if (!items.length) return;
      any = true;
      var section = document.createElement('section');
      section.innerHTML =
        '<div class="domain-heading"><h2>' + esc(d.title) + '</h2>' +
        '<span class="n mono">' + items.length + ' of ' + d.count + '</span></div>' +
        '<p class="domain-summary">' + esc(d.summary) + '</p>';
      var grid = document.createElement('div');
      grid.className = 'grid';
      items.forEach(function(s){
        var card = document.createElement('div');
        card.className = 'card';
        card.tabIndex = 0;
        card.style.setProperty('--dc', domainColor[d.id]);
        var extras = [];
        if (s.has_scripts) extras.push('scripts');
        if (s.has_references) extras.push('refs');
        if (s.has_templates) extras.push('templates');
        if (s.has_assets) extras.push('assets');
        var pills = extras.length ? extras.map(function(e){ return '<span class="pill">' + e + '</span>'; }).join('')
                                  : '<span class="pill">skill</span>';
        card.innerHTML =
          '<div class="card-top"><h3>' + esc(s.name) + '</h3></div>' +
          '<div class="domain-tag">' + esc(d.title) + '</div>' +
          '<p>' + esc(s.description || 'No description provided.') + '</p>' +
          '<div class="card-foot">' + pills + '</div>';
        card.addEventListener('click', function(){ openDetail(s,d); });
        card.addEventListener('keydown', function(e){ if (e.key==='Enter'){ e.preventDefault(); openDetail(s,d); } });
        grid.appendChild(card);
      });
      section.appendChild(grid);
      mainEl.appendChild(section);
    });
    if (!any) {
      mainEl.innerHTML = '<div class="no-results">No skills match &ldquo;' + esc(query) + '&rdquo;' +
        (activeDomain ? ' in this domain' : '') + '.</div>';
    }
  }

  function openDetail(s,d){
    document.getElementById('dTag').textContent = d.title;
    document.getElementById('dTag').style.setProperty('--dc', domainColor[d.id]);
    document.getElementById('dName').textContent = s.name;
    document.getElementById('dPath').innerHTML = '<a href="../' + esc(s.path) + '/">' + esc(s.path) + '</a>';
    document.getElementById('dDesc').textContent = s.description || 'No description provided.';
    var bits = [];
    if (s.original_category) bits.push(s.original_category);
    (s.tags||[]).forEach(function(t){ bits.push('#' + t); });
    if (s.has_scripts) bits.push('has scripts');
    if (s.has_references) bits.push('has references');
    if (s.has_templates) bits.push('has templates');
    if (s.has_assets) bits.push('has assets');
    if (s.version) bits.push('v' + s.version);
    document.getElementById('dMeta').innerHTML = bits.map(function(b){ return '<span class="pill">' + esc(b) + '</span>'; }).join('');
    overlay.hidden = false;
  }

  document.getElementById('closeBtn').addEventListener('click', function(){ overlay.hidden = true; });
  overlay.addEventListener('click', function(e){ if (e.target===overlay) overlay.hidden = true; });
  document.addEventListener('keydown', function(e){ if (e.key==='Escape') overlay.hidden = true; });
  document.getElementById('search').addEventListener('input', function(e){ query = e.target.value.trim(); renderMain(); });

  renderRail();
  renderMain();
})();
</script>
</body>
</html>
